services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: college_fest_hunt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - hunt-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d college_fest_hunt']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hunt-postgres:
